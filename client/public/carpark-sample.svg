<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f24"/><stop offset="1" stop-color="#3a4047"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9097"/><stop offset="1" stop-color="#6d737a"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5057"/><stop offset="1" stop-color="#2c3136"/></linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c9ced3"/><stop offset="1" stop-color="#9aa0a6"/></linearGradient>
  </defs>
  <rect width="1200" height="600" fill="#2c3136"/>
  <rect width="1200" height="130" fill="url(#ceil)"/>
  <!-- ceiling services and lights -->
  <rect x="0" y="58" width="1200" height="10" fill="#565d64"/>
  <rect x="0" y="84" width="1200" height="6" fill="#b5483a"/>
  <g fill="#f4f7e4"><rect x="130" y="100" width="180" height="9" rx="4"/><rect x="510" y="100" width="180" height="9" rx="4"/><rect x="890" y="100" width="180" height="9" rx="4"/></g>
  <!-- back wall -->
  <rect y="130" width="1200" height="170" fill="url(#wall)"/>
  <rect y="238" width="1200" height="26" fill="#f2c200"/>
  <g fill="#22262a"><path d="M0 238h30l-26 26H0zM60 238h30l-26 26H34zM120 238h30l-26 26H94zM180 238h30l-26 26h-30zM240 238h30l-26 26h-30zM300 238h30l-26 26h-30zM360 238h30l-26 26h-30zM420 238h30l-26 26h-30zM480 238h30l-26 26h-30zM540 238h30l-26 26h-30zM600 238h30l-26 26h-30zM660 238h30l-26 26h-30zM720 238h30l-26 26h-30zM780 238h30l-26 26h-30zM840 238h30l-26 26h-30zM900 238h30l-26 26h-30zM960 238h30l-26 26h-30zM1020 238h30l-26 26h-30zM1080 238h30l-26 26h-30zM1140 238h30l-26 26h-30z"/></g>
  <text x="600" y="200" text-anchor="middle" font-size="46" font-weight="700" fill="#e9ecef" opacity=".9">LEVEL B5</text>
  <!-- floor -->
  <path d="M0 300h1200v300H0z" fill="url(#floor)"/>
  <!-- bay lines (perspective) -->
  <g stroke="#f1f3f5" stroke-width="7" stroke-linecap="round" opacity=".92">
    <path d="M190 300 L60 600"/><path d="M463 300 L420 600"/><path d="M737 300 L780 600"/><path d="M1010 300 L1140 600"/>
  </g>
  <!-- painted bay numbers -->
  <g fill="#f1f3f5" font-weight="700" text-anchor="middle" opacity=".9">
    <text x="288" y="560" font-size="50" transform="skewX(-12)" transform-origin="288 560">B5-023</text>
    <text x="600" y="560" font-size="50">B5-024</text>
    <text x="912" y="560" font-size="50" transform="skewX(12)" transform-origin="912 560">B5-025</text>
  </g>
  <!-- floor pucks -->
  <g>
    <ellipse cx="288" cy="462" rx="30" ry="11" fill="#15191c"/><ellipse cx="288" cy="458" rx="26" ry="9" fill="#2f363c"/><circle cx="288" cy="457" r="4" fill="#51cf66"/>
    <ellipse cx="600" cy="462" rx="30" ry="11" fill="#15191c"/><ellipse cx="600" cy="458" rx="26" ry="9" fill="#2f363c"/><circle cx="600" cy="457" r="4" fill="#51cf66"/>
    <ellipse cx="912" cy="462" rx="30" ry="11" fill="#15191c"/><ellipse cx="912" cy="458" rx="26" ry="9" fill="#2f363c"/><circle cx="912" cy="457" r="4" fill="#51cf66"/>
  </g>
  <!-- pillars with QR plates -->
  <g>
    <rect x="150" y="90" width="64" height="250" fill="url(#pillar)"/><rect x="150" y="270" width="64" height="70" fill="#f2c200"/><rect x="164" y="170" width="36" height="36" fill="#fff"/><path d="M168 174h10v10h-10zM186 174h10v10h-10zM168 192h10v10h-10zM182 188h6v6h-6zM190 196h6v6h-6z" fill="#111"/>
    <rect x="986" y="90" width="64" height="250" fill="url(#pillar)"/><rect x="986" y="270" width="64" height="70" fill="#f2c200"/><rect x="1000" y="170" width="36" height="36" fill="#fff"/><path d="M1004 174h10v10h-10zM1022 174h10v10h-10zM1004 192h10v10h-10zM1018 188h6v6h-6zM1026 196h6v6h-6z" fill="#111"/>
  </g>
  <text x="1188" y="590" text-anchor="end" font-size="15" fill="#adb5bd">Illustrated sample — upload your own carpark photo</text>
</svg>
